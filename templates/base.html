<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moje portfolio{% endblock %}</title>
    <script>
        // Apply theme before any rendering to prevent FOUC (Flash of Unstyled Content)
        (function() {
            function getThemeCookie() {
                var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
                return match ? match[1] : null;
            }
            var saved = getThemeCookie();
            var mode = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'auto';
            var theme;
            if (mode === 'light' || mode === 'dark') {
                theme = mode;
            } else {
                // 'auto' or no cookie: follow OS preference
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            // Store resolved mode for JS to pick up
            window.__themeMode = mode;
            // Pre-set toggle icon and label so it's visible before main.js loads
            var icons = { light: '☀️', dark: '🌙', auto: '💻' };
            var labels = { light: 'Světlý', dark: 'Tmavý', auto: 'Auto' };
            document.addEventListener('DOMContentLoaded', function() {
                var iconEl = document.getElementById('theme-icon');
                var labelEl = document.getElementById('theme-label');
                if (iconEl && !iconEl.textContent) iconEl.textContent = icons[mode];
                if (labelEl && !labelEl.textContent) labelEl.textContent = labels[mode];
            });
        })();
    </script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon/favicon-chart.png') }}" sizes="64x64">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/favicon-chart.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Moje portfolio</h1>
                <p class="subtitle">Sledování akcií s daňovou optimalizací</p>
            </div>

            <div id="year-switch" class="years" role="group" aria-label="Daňový rok"></div>

            <button id="update-prices-btn" class="btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
                Aktualizovat ceny
            </button>

            <button class="btn" id="theme-toggle" type="button">
                <span id="theme-icon" aria-hidden="true"></span>
                <span id="theme-label"></span>
            </button>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer>
        <span id="prices-updated">Ceny zatím nebyly načteny</span>
        <span>
            <a href="/api/export/transactions">Transakce (CSV)</a>
            &nbsp;·&nbsp;
            <a href="/api/export/tax-report">Daňová zpráva (CSV)</a>
        </span>
    </footer>

    <button type="button" class="fab" id="add-fab" aria-controls="add-panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Přidat transakci
    </button>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/cs.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
